            let html5QrCode = null;

            // ===== REPLACED with a more robust version =====
            function initPostbase() {
                console.log("🔍 initPostbase() called.");
                console.log("   POSTBASE_URL:", POSTBASE_URL);
                console.log("   POSTBASE_ANON_KEY:", POSTBASE_ANON_KEY ? "set" : "missing");

                if (!POSTBASE_URL || POSTBASE_URL === "YOUR_POSTBASE_PROJECT_URL") {
                    console.error("❌ Postbase URL not configured.");
                    return null;
                }
                if (!POSTBASE_ANON_KEY || POSTBASE_ANON_KEY === "YOUR_POSTBASE_ANON_KEY") {
                    console.error("❌ Postbase anon key not configured.");
                    return null;
                }

                try {
                    // Check global object
                    const pb = window.postbase || window.Postbase;
                    console.log("   window.postbase / window.Postbase:", pb);

                    if (!pb) {
                        console.error("❌ Postbase SDK not loaded. Check the CDN script tag.");
                        return null;
                    }

                    // Try multiple instantiation patterns
                    if (typeof pb.createClient === 'function') {
                        console.log("✅ Using pb.createClient(...)");
                        return pb.createClient(POSTBASE_URL, POSTBASE_ANON_KEY);
                    }
                    if (typeof pb === 'function') {
                        console.log("✅ Using new pb(...)");
                        return new pb(POSTBASE_URL, POSTBASE_ANON_KEY);
                    }
                    // Some libraries use a default export
                    if (pb.default && typeof pb.default.createClient === 'function') {
                        console.log("✅ Using pb.default.createClient(...)");
                        return pb.default.createClient(POSTBASE_URL, POSTBASE_ANON_KEY);
                    }
                    if (pb.default && typeof pb.default === 'function') {
                        console.log("✅ Using new pb.default(...)");
                        return new pb.default(POSTBASE_URL, POSTBASE_ANON_KEY);
                    }

                    console.error("❌ Unknown Postbase SDK structure. Available:", pb);
                    return null;
                } catch (e) {
                    console.error("❌ Failed to init Postbase client:", e);
                    return null;
                }
            }

            // ---------- Generate UUID v4 (fallback) ----------
            function generateUUID() {
                if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                    return crypto.randomUUID();
                }
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            // ---------- Generate QR session ----------
            async function generateQRSession() {
                if (isQrGenerating) return;
                isQrGenerating = true;
                qrStatus.textContent = t('qrConnecting') + '...';
                qrScanError.textContent = '';

                console.log("🔄 generateQRSession() started");
                const client = initPostbase();
                console.log("   client after initPostbase:", client);

                if (!client) {
                    qrStatus.textContent = t('qrError', { msg: 'Postbase not configured' });
                    isQrGenerating = false;
                    return;
                }

                const sessionId = generateUUID();
                const desktopPeerId = myId; // our own PeerJS ID
                console.log("   sessionId:", sessionId, "desktopPeerId:", desktopPeerId);

                try {
                    // Insert session
                    const { error } = await client.from('device_sessions').insert({
                        id: sessionId,
                        status: 'pending',
                        user_id: null,
                        created_at: new Date().toISOString()
                    });
                    if (error) throw error;
                    console.log("✅ Session inserted");

                    activeSessionId = sessionId;

                    // Generate QR data: we encode sessionId + desktopPeerId
                    const qrData = JSON.stringify({ sessionId, peerId: desktopPeerId });

                    // Clear previous QR
                    qrCodeContainer.innerHTML = '';
                    // Create QR code using qrcode.js
                    qrCodeInstance = new QRCode(qrCodeContainer, {
                        text: qrData,
                        width: 200,
                        height: 200,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                    console.log("✅ QR code generated");

                    qrStatus.textContent = t('qrWaiting');
                    qrStatus.dataset.manual = 'true';

                    // Subscribe to real-time updates
                    if (activeSubscription) {
                        activeSubscription.unsubscribe();
                        activeSubscription = null;
                    }

                    activeSubscription = client.from('device_sessions')
                        .on('*', (payload) => {
                            if (payload.eventType === 'UPDATE' && payload.new && payload.new.id === sessionId) {
                                if (payload.new.status === 'connected') {
                                    qrStatus.textContent = t('qrConnected');
                                    qrStatus.style.color = 'var(--success)';
                                    setTimeout(() => {
                                        closeQRModal();
                                    }, 1500);
                                }
                            }
                        })
                        .subscribe();
                    console.log("✅ Real-time subscription active");

                } catch (err) {
                    console.error('❌ QR session error:', err);
                    qrStatus.textContent = t('qrError', { msg: err.message || 'Unknown' });
                    qrStatus.style.color = 'var(--danger)';
                } finally {
                    isQrGenerating = false;
                }
            }
